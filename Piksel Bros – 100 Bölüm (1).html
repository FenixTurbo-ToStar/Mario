 const g=$('wl');g.innerHTML='';for(let j=1;j<=10;j++){const n=(sel-1)*10+j,b=document.createElement('button'),lk=n>S.u;b.className='lb '+(lk?'lk':S.done[n]?'dn':'');b.textContent=lk?'🔒':(j==10?'👹':'')+n+(S.done[n]?'★':'');b.title=S.bt[n]?fmtT(S.bt[n]):'';if(!lk)b.onclick=()=>start(n);g.appendChild(b)}}
const ITM=[{n:'Ekstra Can',d:'Ölünce son bayraktan devam, bonus kalır',p:1200,g:()=>S.lf,f:()=>S.lf++},{n:'Başlangıç Mantarı',d:'Sonraki bölüme büyük başla',p:800,g:()=>S.inv.big,f:()=>S.inv.big++},{n:'Yıldız',d:'Bölüme 15 sn yenilmez başla',p:1500,g:()=>S.inv.star,f:()=>S.inv.star++},{n:'Ateş Çiçeği',d:'Bölüme ateş gücüyle başla',p:900,g:()=>S.inv.fire|0,f:()=>S.inv.fire=(S.inv.fire|0)+1},{n:'Süper Zıplama',d:'Bölüme süper zıplamayla başla',p:900,g:()=>S.inv.jump|0,f:()=>S.inv.jump=(S.inv.jump|0)+1},{n:'Görünmezlik',d:'Bölüme görünmez başla',p:1000,g:()=>S.inv.ghost|0,f:()=>S.inv.ghost=(S.inv.ghost|0)+1}];
const UPG=[['j','Süper Zıplama','Daha yüksek zıpla',[3000,6000,10000]],['s','Hız Çizmeleri','Daha hızlı koş',[3000,6000,10000]],['m','Altın Mıknatısı','Altınları uzaktan topla',[2000,5000,9000]]];
let tab=1,msg='';
function buildShop(){$('sw').textContent=msg||('CÜZDAN: '+S.w+'  ♥ '+S.lf);msg='';$('t1').style.filter=tab==1?'none':'brightness(.6)';$('t2').style.filter=tab==2?'none':'brightness(.6)';let h='';
 if(tab==1)COS.forEach((c,i)=>{const own=S.own[i],sel=S.sk==i;h+=`<div class="it${sel?' sel':''}"><img src="${SK[i][0].toDataURL()}"><b>${c[0]}</b>${own?`<button class="b s${sel?'':' g'}" data-a="eq" data-i="${i}">${sel?'SEÇİLİ':'SEÇ'}</button>`:`<button class="b s" data-a="bc" data-i="${i}">${c[1]}</button>`}</div>`});
 else{ITM.forEach((m,i)=>h+=`<div class="it"><b>${m.n}</b><span>${m.d}</span><span>Elinde: ${m.g()}</span><button class="b s" data-a="bi" data-i="${i}">${m.p}</button></div>`);
  UPG.forEach((u,i)=>{const l=S.up[u[0]];h+=`<div class="it"><b>${u[1]}</b><span>${u[2]}</span><span>Seviye ${l}/3</span>${l>=3?'<button class="b s" disabled>MAKS</button>':`<button class="b s" data-a="bu" data-i="${i}">${u[3][l]}</button>`}</div>`})}
 $('sl').innerHTML=h}
$('sl').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const i=+b.dataset.i,a=b.dataset.a,pay=p=>{if(S.w<p){msg='YETERLİ PUAN YOK!';return 0}S.w-=p;return 1};
 if(a=='eq'){S.sk=i;SP=SK[i]}else if(a=='bc'){if(pay(COS[i][1])){S.own[i]=1;S.sk=i;SP=SK[i];sfx('p')}}
 else if(a=='bi'){if(pay(ITM[i].p)){ITM[i].f();sfx('p')}}else if(a=='bu'){const u=UPG[i],l=S.up[u[0]];if(l<3&&pay(u[3][l])){S.up[u[0]]++;sfx('p')}}
 save();buildShop()};
$('t1').onclick=()=>{tab=1;buildShop()};$('t2').onclick=()=>{tab=2;buildShop()};
$('bw').onclick=()=>{buildWm();show('wm')};$('bh').onclick=()=>{tab=1;buildShop();show('sh')};
$('zm').onclick=()=>{S.zm=Math.max(0,S.zm-10);save();setUi()};$('zp').onclick=()=>{S.zm=Math.min(50,S.zm+10);save();setUi()};
$('cm').onclick=()=>{S.cz=Math.max(0,S.cz-2);save();setUi()};$('cp').onclick=()=>{S.cz=Math.min(10,S.cz+2);save();setUi()};
const fmtT=x=>Math.floor(x/60)+':'+(x%60<10?'0':'')+(x%60).toFixed(1);
const QP=[{id:'coins',t:'Altın topla',n:[40,80,120],r:[600,1000,1500]},{id:'kills',t:'Düşman yen',n:[8,15,25],r:[600,1000,1500]},{id:'levels',t:'Bölüm tamamla',n:[2,3,5],r:[800,1200,2000]},{id:'nodeath',t:'Ölmeden bölüm bitir',n:[1,2,3],r:[900,1500,2200]},{id:'fire',t:'Ateş topuyla düşman yen',n:[3,6,10],r:[800,1300,1800]},{id:'secret',t:'Gizli odaya gir',n:[1,2,3],r:[700,1200,1800]},{id:'boss',t:'Boss yen',n:[1,1,2],r:[1500,2000,3000]},{id:'cp',t:'Kontrol noktası geç',n:[3,6,9],r:[500,900,1300]}];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function dqCheck(){const t=today();if(S.dq.d==t&&S.dq.q.length)return;let h=7;for(const ch of t)h=(h*31+ch.charCodeAt(0))|0;const r=rng(h),ids=QP.map((_,i)=>i),q=[];for(let i=0;i<3;i++){const k=ids.splice(r()*ids.length|0,1)[0];q.push({k,lv:i,tg:QP[k].n[i],pr:0,cl:0})}S.dq={d:t,q,bonus:0};save()}
function qp(id,n=1){if(id=='coins')S.st.coins+=n;if(id=='kills')S.st.kills+=n;dqCheck();S.dq.q.forEach(q=>{if(QP[q.k].id==id&&q.pr<q.tg){q.pr=Math.min(q.tg,q.pr+n);if(q.pr>=q.tg){if(P)pop(P.x,P.y-24,'GÖREV TAMAM!');save()}}})}
function buildDq(){dqCheck();let h='',all=1;S.dq.q.forEach((q,i)=>{const d=QP[q.k],ok=q.pr>=q.tg;if(!q.cl)all=0;h+=`<div class="dr"><div class="t">${d.t} (${q.pr}/${q.tg})<div class="bar"><i style="width:${q.pr/q.tg*100}%"></i></div></div><b style="color:#fcd800">+${d.r[q.lv]}</b>${q.cl?'<span>✔</span>':ok?`<button class="b s g" data-q="${i}">AL</button>`:'<span>…</span>'}</div>`});
 h+=`<div class="dr"><div class="t">Tüm görevler bonusu: +2500 puan ve +1 ekstra can</div>${S.dq.bonus?'<span>✔</span>':all?'<button class="b s g" data-q="b">AL</button>':'<span>🔒</span>'}</div>`;$('dl').innerHTML=h}
$('dl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.q;if(k=='b'){if(S.dq.bonus||!S.dq.q.every(q=>q.cl))return;S.dq.bonus=1;S.w+=2500;S.tot+=2500;S.lf++}else{const q=S.dq.q[+k];if(q.cl||q.pr<q.tg)return;q.cl=1;const r=QP[q.k].r[q.lv];S.w+=r;S.tot+=r}sfx('p');save();buildDq();setUi()};
$('bq').onclick=()=>{buildDq();show('dq')};
function buildRk(){const e=Object.entries(S.bt).map(a=>[+a[0],a[1]]).sort((a,b)=>a[1]-b[1]),st=S.st;
 const best=e[0]?`En hızlı bölüm: ${e[0][0]} – ${fmtT(e[0][1])}`:'Henüz rekor yok';
 const L1=e.slice(0,10).map((x,i)=>`<div class="rl"><span>${i+1}. Bölüm ${x[0]}</span><b>${fmtT(x[1])}</b></div>`).join('')||'<div>—</div>';
 const R1=[['Tamamlanan bölüm',Object.keys(S.done).length+'/'+NL],['Toplam puan',S.tot],['Toplanan altın',st.coins],['Yenilen düşman',st.kills],['Yenilen boss',st.bosses],['Toplam ölüm',st.deaths],['Oynama süresi',Math.floor(st.play/60)+' dk']].map(x=>`<div class="rl"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
 $('rl2').innerHTML=`<div><div style="color:#fcd800;margin-bottom:6px">EN HIZLI 10 BÖLÜM</div>${L1}<div style="margin-top:8px">${best}</div></div><div><div style="color:#fcd800;margin-bottom:6px">TOPLAM REKORLAR</div>${R1}</div>`}

const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j',KeyZ:'j',ShiftLeft:'run',ShiftRight:'run',KeyX:'run',ArrowDown:'dn',KeyS:'dn',KeyF:'fb',KeyC:'fb'};
addEventListener('keydown',e=>{if(e.code=='Escape'||e.code=='KeyP'){pause();return}const k=KM[e.code];if(k){e.preventDefault();if(k=='j'&&!K.j)jb=7;K[k]=1}});
